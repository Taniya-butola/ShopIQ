version: "3.9"

# PriceWise - Production Docker Compose
# Usage: docker compose up --build -d
#
# Services:
#   backend  - Flask API on :5000
#   redis    - Cache layer on :6379
#   mongo    - Database on :27017
#   nginx    - Reverse proxy on :80

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricewise-backend
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://mongo:27017/pricewise
      - FLASK_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - mongo
    restart: unless-stopped
    networks:
      - pricewise-network

  redis:
    image: redis:7-alpine
    container_name: pricewise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - pricewise-network

  mongo:
    image: mongo:7
    container_name: pricewise-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - pricewise-network

  nginx:
    image: nginx:alpine
    container_name: pricewise-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pricewise-network

volumes:
  redis-data:
  mongo-data:

networks:
  pricewise-network:
    driver: bridge
